amcl:
  ros__parameters:
    use_sim_time: true

    # Robot / map frames
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom

    # LiDAR input
    scan_topic: /scan
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    max_beams: 60

    # Odometry noise model
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Particle filter
    min_particles: 500
    max_particles: 2000
    resample_interval: 1

    # Update behavior
    update_min_d: 0.15
    update_min_a: 0.15
    transform_tolerance: 1.0

    # Initial pose is published from the launch file
    set_initial_pose: false
    always_reset_initial_pose: false


map_server:
  ros__parameters:
    use_sim_time: true

    yaml_filename: /home/ros2/multi_modal_ws/src/multi_modal_bringup/maps/warehouse_map.yaml


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.30
      use_astar: true
      allow_unknown: true


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0

    progress_checker_plugins:
      - progress_checker
    goal_checker_plugins:
      - goal_checker
    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 12.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.4
      stateful: false

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      # Stable manual-goal behavior
      desired_linear_vel: 0.50
      min_approach_linear_velocity: 0.14
      approach_velocity_scaling_dist: 0.35

      # Lookahead
      lookahead_dist: 0.85
      min_lookahead_dist: 0.45
      max_lookahead_dist: 1.25
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      # Keep RPP smooth and avoid over-stopping
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.70

      # Velocity regulation near curves/costs
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.7
      regulated_linear_scaling_min_speed: 0.13
      cost_scaling_dist: 0.32
      cost_scaling_gain: 0.65
      inflation_cost_scaling_factor: 4.0

      # Heading behavior
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 1.57
      max_angular_accel: 2.0

      # Other motion constraints
      allow_reversing: false
      transform_tolerance: 0.2
      use_interpolation: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      robot_radius: 0.22

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.48

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0

      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.45

      always_send_full_costmap: true


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 30
    wait_for_service_timeout: 1000

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml


behavior_server:
  ros__parameters:
    use_sim_time: true

    global_frame: odom
    robot_base_frame: base_link
    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait


waypoint_follower:
  ros__parameters:
    use_sim_time: true


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP

    max_velocity:
      - 0.48
      - 0.0
      - 0.75

    min_velocity:
      - 0.0
      - 0.0
      - -0.75

    max_accel:
      - 1.3
      - 0.0
      - 1.7

    max_decel:
      - -1.3
      - 0.0
      - -1.7

    odom_topic: /odom
    odom_duration: 0.1

    deadband_velocity:
      - 0.0
      - 0.0
      - 0.0

    velocity_timeout: 1.0


robot_state_publisher:
  ros__parameters:
    use_sim_time: true